name: CI

on:
  push:
    branches: ["codex/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  ROOT_URL: http://localhost:3000
  NEXTAUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-build-only-not-a-production-secret
  BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-0123456789
  BETTER_AUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-build-only-google-client
  GOOGLE_CLIENT_SECRET: ci-build-only-google-secret
  # Build verification must never connect to production services.
  MONGO_URL: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=100
  DATABASE_URL: postgresql://build:build@127.0.0.1:1/build?sslmode=disable
  DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:1/build?sslmode=disable

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm check
      - run: pnpm typecheck
      # The package's published shape: built, packed, installed into a
      # fixture, type-checked and loaded (plan 052), keeping the tarball.
      - run: pnpm --filter magick-data smoke --keep-tarball "$RUNNER_TEMP/magick-data.tgz"
      # For the registry job, which runs only on its own events (below).
      - if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: magick-data-tarball
          path: ${{ runner.temp }}/magick-data.tgz
          if-no-files-found: error
          retention-days: 1

  # The verified tarball is publishable (plan 080, decision 3): the decision
  # publish.yml would make, and a dry run of its publish with the same npm.
  # Only on a pull request or a codex/** push, never when release.yml or
  # publish.yml calls this workflow (a push to main), so that the registry's
  # state, which the repository does not control (a squatter at a higher
  # version, an older commit after a publish, an outage), never blocks a
  # deploy; publish.yml decides for itself. Not in verify's needs, which
  # keeps the required check as it was.
  registry:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/')) }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # On a pull request this checks out the merge commit; its first
      # parent is the base branch it merges into, the version to compare.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      # The Node and npm publish.yml uses; keep the version in step with it.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: magick-data-tarball
          path: ${{ runner.temp }}/registry
      # Fatal only for what this change controls: on a pull request that
      # changes the package's version, a bump that is not above the
      # registry's, or names a version it already lists (--changed), fails.
      # The registry's own errors and state, and anything on a pull request
      # that leaves the version alone, only warn. The base is the merge
      # commit's first parent, not the event's base.sha, which can be older.
      - name: Decide as publish.yml would
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          flags="--advisory all"
          if [ "$EVENT" = pull_request ]; then
            base="$(git show "HEAD^1:packages/magick-data/package.json" \
              | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
            head="$(node -p 'require("./packages/magick-data/package.json").version')"
            echo "magick-data $base on the base, $head here"
            if [ "$base" != "$head" ]; then flags="--advisory registry --changed"; fi
          fi
          # shellcheck disable=SC2086 # two flags, word-split on purpose
          node scripts/npm-publish-decision.mjs \
            "$RUNNER_TEMP/registry/magick-data.tgz" $flags
      # npm refuses even a dry run of a version the registry lists, and of a
      # pre-release without --tag, so this takes the rule's tag and is
      # skipped once the version is published or the rule could not decide.
      - name: Dry-run a publish of the verified tarball
        if: steps.decide.outputs.action != 'fail' && steps.decide.outputs.published != 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: >-
          npm publish "$RUNNER_TEMP/registry/magick-data.tgz"
          --dry-run --access public --tag "$TAG"

  tests:
    name: Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Test with coverage
        run: >-
          pnpm test:coverage
          --config=vitest.shard.config.mts
          --shard=${{ matrix.shard }}/4
          --reporter=default --reporter=blob
          --outputFile.blob=output/ci/vitest/shard-${{ matrix.shard }}.json
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vitest-shard-${{ matrix.shard }}
          path: output/ci/vitest/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  coverage:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: vitest-shard-*
          path: output/ci/vitest
          merge-multiple: true
      - name: Merge coverage and enforce per-file thresholds
        run: |
          for shard in 1 2 3 4; do
            test -s "output/ci/vitest/shard-$shard.json"
          done
          pnpm exec vitest run --coverage --merge-reports=output/ci/vitest
      - name: Upload combined coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  build:
    name: Build (${{ matrix.bundler }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundler: webpack
            command: build
          - bundler: turbopack
            command: check:turbopack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Cache Next.js build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ matrix.bundler }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ matrix.bundler }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}-
      # Separate runners keep webpack's production/service-worker output and
      # Turbopack's development compatibility check from overwriting each other.
      - run: pnpm ${{ matrix.command }}

  # Preserve the existing required check, and fail it even if a dependency was
  # skipped or cancelled. Production release still waits for the whole workflow.
  verify:
    if: ${{ always() }}
    needs: [checks, tests, coverage, build]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = success,success,success,success
