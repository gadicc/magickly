name: CI

on:
  push:
    branches: ["codex/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ROOT_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-build-only-not-a-production-secret
      BETTER_AUTH_SECRET: ci-build-only-better-auth-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-build-only-google-client
      GOOGLE_CLIENT_SECRET: ci-build-only-google-secret
      # Build verification must never connect to production services.
      MONGO_URL: mongodb://127.0.0.1:1/?serverSelectionTimeoutMS=100
      DATABASE_URL: postgresql://build:build@127.0.0.1:1/build?sslmode=disable
      DATABASE_URL_UNPOOLED: postgresql://build:build@127.0.0.1:1/build?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm 11's own action installs pnpm (from packageManager) and Node.js.
      # v2 does not read .nvmrc, so keep node@24 in step with it.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec loom init
      - run: pnpm exec loom check
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # The package's published shape: built, packed, installed into a
      # fixture, type-checked and loaded (plan 052).
      - run: pnpm --filter magick-data smoke
      # Development runs on Turbopack while production builds with webpack
      # (above). This Turbopack build replaces that output and only checks
      # the development path still compiles and prerenders.
      - run: pnpm check:turbopack
