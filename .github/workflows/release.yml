name: Production release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Build a release, or promote a reviewed configuration variant
        type: choice
        options: [build, promote-existing]
        default: build
      deployment_url:
        description: Existing immutable staged Production URL (promotion only)
        type: string
      deployment_id:
        description: Exact existing staged deployment ID (promotion only)
        type: string
      expected_production_id:
        description: Expected current canonical deployment ID (promotion only)
        type: string
      source_sha:
        description: Full SHA shared by staged, live and workflow sources (promotion only)
        type: string
      expires_at_ms:
        description: Absolute Unix milliseconds; at most one hour away (promotion only)
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    if: github.ref == 'refs/heads/main' && inputs.mode != 'promote-existing'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # pnpm 11's own action installs pnpm (from packageManager) and Node.js.
      # v2 does not read .nvmrc, so keep node@24 in step with it.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec loom init
      - run: pnpm exec loom check --production

      - name: Validate deployment configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Refuse an unresolved previous promotion
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-checks.mjs preflight

      - name: Pull production settings and preserve migration environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          umask 077
          pnpm dlx vercel@59.13.1 pull --yes --environment=production --scope "$VERCEL_ORG_ID"
          cp .vercel/.env.production.local "$RUNNER_TEMP/vercel-production.env"
          chmod 600 "$RUNNER_TEMP/vercel-production.env"

      # Loom's shared rule: every pulled value that could be secret, read the
      # way the app reads it; short and public values stay readable in logs.
      - name: Mask pulled secret values
        run: pnpm exec loom db release mask-env .vercel/.env.production.local

      - name: Read production environment metadata
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          umask 077
          pnpm dlx vercel@59.13.1 env ls production --format=json --scope "$VERCEL_ORG_ID" > "$RUNNER_TEMP/vercel-production-env.json"

      - name: Prepare metadata-backed build placeholders
        run: |
          pnpm exec loom db release prepare-build-env \
            .vercel/.env.production.local \
            "$RUNNER_TEMP/vercel-production-env.json" \
            .github/vercel-production-env.json \
            "$RUNNER_TEMP/vercel-build-placeholders.json"

      - name: Verify migration connection
        env:
          MIGRATION_DATABASE_URL_UNPOOLED: ${{ secrets.MIGRATION_DATABASE_URL_UNPOOLED }}
          LOOM_MIGRATION_DATABASE_ROLE: ${{ vars.LOOM_MIGRATION_DATABASE_ROLE }}
        run: |
          pnpm exec loom db migrations verify-env --connect \
            --env-file "$RUNNER_TEMP/vercel-production.env"

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx vercel@59.13.1 build --prod --standalone --scope "$VERCEL_ORG_ID"

      - name: Check the build registers the nightly purge cron
        run: node scripts/release-checks.mjs crons

      - name: Reject placeholder leakage
        run: |
          pnpm exec loom db release verify-build-env \
            .vercel/output "$RUNNER_TEMP/vercel-build-placeholders.json"

      - name: Stage production deployment
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(pnpm dlx vercel@59.13.1 deploy --prebuilt --prod --skip-domain --yes --scope "$VERCEL_ORG_ID")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Apply compatible Drizzle migrations
        env:
          MIGRATION_DATABASE_URL_UNPOOLED: ${{ secrets.MIGRATION_DATABASE_URL_UNPOOLED }}
        run: |
          cp "$RUNNER_TEMP/vercel-production.env" .vercel/.env.production.local
          chmod 600 .vercel/.env.production.local
          node --env-file=.vercel/.env.production.local - <<'NODE'
          const { spawnSync } = require('node:child_process');
          const result = spawnSync('pnpm', ['run', 'db:migrate'], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE

      - name: Verify staged application and completed import gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/release-checks.mjs staged

      # IndexNow (scripts/indexnow.mjs): fingerprint the pages production
      # serves now, so the pages this release changes can be told apart.
      # Search notifications never block or fail a release.
      - name: Fingerprint live pages for IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs snapshot "$RUNNER_TEMP/indexnow-before.json"

      - name: Recheck promotion fence immediately before moving aliases
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-checks.mjs preflight

      - name: Promote the verified artifact
        id: promote
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm dlx vercel@59.13.1 promote "$DEPLOYMENT_URL" --yes --timeout=5m --scope "$VERCEL_ORG_ID"

      # A CLI timeout does not cancel promotion. Resolve the provider's actual
      # state even after a failed command; never treat its exit code as rollback.
      - name: Resolve promotion and verify production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/release-checks.mjs promoted

      - name: Tell IndexNow which pages changed
        continue-on-error: true
        run: node scripts/indexnow.mjs submit "$RUNNER_TEMP/indexnow-before.json"

  # Configuration variants use the SAME workflow identity and release lock.
  # Inputs carry provider identities only, never private settings or credentials.
  promote_existing:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'promote-existing'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: Production
      url: ${{ inputs.deployment_url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DEPLOYMENT_URL: ${{ inputs.deployment_url }}
      EXPECTED_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      EXPECTED_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.expected_production_id }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      PROMOTION_EXPIRES_AT_MS: ${{ inputs.expires_at_ms }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec loom init
      - run: pnpm exec loom check --production

      - name: Prepare the pinned promotion CLI before the final guard
        run: |
          mkdir -m 700 "$RUNNER_TEMP/promotion-cli"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { packageManager } = require('./package.json');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'promotion-cli/package.json'),
            JSON.stringify({ private: true, packageManager }));
          NODE
          pnpm --dir "$RUNNER_TEMP/promotion-cli" add --ignore-scripts --save-exact vercel@59.13.1

      - name: Guard the existing artifact and production baseline
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/existing-promotion.mjs

      - name: Verify the existing staged application
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-checks.mjs staged

      - name: Guard and launch the bounded configuration promotion
        id: existing_promotion
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          PROMOTION_CLI_ROOT: ${{ runner.temp }}/promotion-cli
        run: node scripts/existing-promotion-launch.mjs

      # As in a normal release, a CLI failure is not a rollback witness.
      - name: Resolve promotion and verify production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/release-checks.mjs promoted

      - name: Require known local promotion-process closure
        if: ${{ always() && steps.existing_promotion.outcome != 'skipped' }}
        env:
          DISPATCHED: ${{ steps.existing_promotion.outputs.dispatched }}
          CLOSED: ${{ steps.existing_promotion.outputs.closed }}
          CANCELLED: ${{ steps.existing_promotion.outputs.cancelled }}
        run: test "$DISPATCHED" = true && test "$CLOSED" = true && test "$CANCELLED" = false
